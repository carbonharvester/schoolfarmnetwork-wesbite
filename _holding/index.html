<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>School Farm Network</title>
<meta name="description" content="School Farm Network.">

<style>
  :root{ --paper:#F4F2EC; --ink:#1A1C18; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--paper);color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:32px;line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  main{max-width:34ch}
  svg{width:30px;height:30px;display:block;margin-bottom:22px}
  h1{font-size:19px;font-weight:600;letter-spacing:-.01em}
  p{margin-top:10px;font-size:16px;color:rgba(26,28,24,.66)}
  @media (prefers-color-scheme: dark){
    :root{ --paper:#15171A; --ink:#EDEBE4 }
    p{color:rgba(237,235,228,.66)}
  }
</style>
</head>
<body>
  <main>
    <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <line x1="10" y1="46" x2="54" y2="46" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
      <line x1="16" y1="34" x2="48" y2="34" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
      <line x1="22" y1="22" x2="34" y2="22" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
